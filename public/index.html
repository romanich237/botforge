<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BotForge · Проекты</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#1461ed">
  <link rel="stylesheet" href="/canvas.css">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/canvas.js"></script>
  <script defer src="/guide.js"></script>
  <script defer src="/runtime.js"></script>
  <script defer src="/languages.js"></script>
  <script defer src="/preview.js"></script>
  <script defer src="/layout.js"></script>
  <script defer src="/ai.js"></script>
  <script defer src="/editor.js"></script>
  <script defer src="/tour.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#projects" class="brand"><img class="brand-logo" src="/logo.png" width="36" height="36" alt=""> BotForge</a>
    <nav aria-label="Основная навигация">
      <a href="#projects" title="Проекты" aria-label="Проекты" data-page="projects"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/icons.svg#folder"></use></svg></span> Проекты</a>
      <a href="#builder" title="Конструктор" aria-label="Конструктор" data-page="builder"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/icons.svg#workflow"></use></svg></span> Конструктор</a>
      <a href="#behavior" title="Поведение бота" aria-label="Поведение бота" data-page="behavior"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/icons.svg#sliders-horizontal"></use></svg></span> Поведение бота</a>
      <a href="#variables" title="Переменные" aria-label="Переменные" data-page="variables"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/icons.svg#braces"></use></svg></span> Переменные</a>
      <a href="#testing" title="Тестирование" aria-label="Тестирование" data-page="testing"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/icons.svg#play"></use></svg></span> Тестирование</a>
      <a href="#export" title="Экспорт" aria-label="Экспорт" data-page="export"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/icons.svg#download"></use></svg></span> Экспорт</a>
      <a href="#settings" title="Настройки" aria-label="Настройки" data-page="settings"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/icons.svg#settings"></use></svg></span> Настройки</a>
      <a href="#guide" title="Как пользоваться" aria-label="Как пользоваться" data-page="guide"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/icons.svg#circle-help"></use></svg></span> Как пользоваться</a>
    </nav>
    <div class="sidebar-note"><span class="dot"></span> Рабочее пространство <small>Telegram · первая версия</small></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span id="breadcrumb">Рабочее пространство</span><span class="local-badge">Серверное хранение</span><button type="button" class="help-button" id="open-guide"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/icons.svg#circle-help"></use></svg> Помощь</button></header>
    <main id="main"></main>
  </div>
  <dialog id="create-dialog" aria-labelledby="create-title">
    <form id="create-form">
      <div class="dialog-heading"><h2 id="create-title">Новый бот</h2><button type="button" class="icon-button" id="close-dialog" aria-label="Закрыть">×</button></div>
      <label for="bot-name">Название бота</label>
      <input id="bot-name" name="name" required maxlength="80" placeholder="Например, магазин" autocomplete="off">
      <label for="platform">Платформа</label>
      <select id="platform"><option>Telegram</option></select>
      <p class="muted">Другие платформы появятся на следующих этапах.</p>
      <div class="dialog-actions"><button type="button" id="cancel-dialog">Отмена</button><button class="primary" type="submit">Создать бота</button></div>
    </form>
  </dialog>
  <dialog id="ai-dialog" aria-labelledby="ai-title"></dialog>
  <dialog id="guide-dialog" aria-labelledby="guide-title"></dialog>
  <p class="toast" id="toast" role="status" hidden></p>
</body>
</html>
